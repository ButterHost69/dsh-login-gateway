# dsh-login-gateway bundle patch.
#
# Selects this plugin for the profile that installs it and inserts its row.
# The row starts with no users on purpose: the plugin then serves first-run
# setup, which asks for the first username and password and stores the account
# as a credential record. Restart `dsh web` (or let HMR reload the profile)
# after installing.
#
#   dsh plugin --profile web add -w github:ButterHost69/dsh-login-gateway
#
# To declare accounts in configuration instead, add them under `users`; each
# one needs a scrypt hash and a base32 TOTP secret, which `npm run enroll` in
# this repository prints ready to paste.
- insert:
    - id: login-gateway
      name: 'dsh-login-gateway'
      config:
        # Public listener the tunnel or reverse proxy forwards to. Loopback
        # keeps the plain-HTTP leg off the network; the tunnel reaches it.
        listenHost: '127.0.0.1'
        listenPort: 8080
        # Empty means first-run setup in the browser.
        users: []
